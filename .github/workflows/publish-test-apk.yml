name: Publish test APK

# Publishes the release (R8-shrunk, debug-signed) APK of every green push to main to GitHub Pages: a stable public link, no release and no tag.
#
# This is a separate workflow (not a job of ci.yml) so that pull requests do not show a skipped
# "publish" check. It runs after the CI workflow finished, so the tests are not repeated here.
# GitHub runs `workflow_run` workflows only from the default branch, so changes to this file
# take effect after they are merged into main.
#
# The APK has to be signed with the same debug key as the builds on the phone, otherwise Android
# refuses to install it over the existing app (and uninstalling would erase the app data). A
# runner generates a fresh debug key on every run, so the key comes from the repository secret
# DEBUG_KEYSTORE_BASE64 (base64 of ~/.android/debug.keystore).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-test-apk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish test APK
    # Only a successful CI run of a push to main of this repository. The event and repository
    # checks matter: a pull request from a fork branch named `main` also reports head branch
    # `main`, and it must never reach the signing key.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The commit CI has tested; GITHUB_SHA here is the current head of main, which may be newer.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The secret DEBUG_KEYSTORE_BASE64 is not set. Without it the APK would get a random key and could not update the installed app."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build the test APK
        run: ./gradlew assembleRelease -PappUpdateChannel=dev "-PappVersionSuffix=-test.${CI_RUN_NUMBER}+${HEAD_SHA::7}"

      - name: Show the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'certificate SHA-256'

      - name: Prepare the download page
        run: |
          mkdir site
          cp app/build/outputs/apk/release/app-release.apk site/frigate-android-test.apk
          # The test builds of the app check this file for a newer build (GitHubUpdateFeed).
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          version_name="$("$aapt2" dump badging site/frigate-android-test.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          [ -n "$version_name" ] || { echo "::error::No versionName in the APK"; exit 1; }
          printf '{"versionName":"%s","build":%s,"commit":"%s","apk":"frigate-android-test.apk"}\n' \
            "$version_name" "$CI_RUN_NUMBER" "$HEAD_SHA" > site/version.json
          cat site/version.json
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Frigate Android test build</title></head>
          <body>
          <h1>Frigate Android test build</h1>
          <p><a href="frigate-android-test.apk">Download frigate-android-test.apk</a></p>
          <p>Build ${CI_RUN_NUMBER} of main, commit <a href="https://github.com/${{ github.repository }}/commit/${HEAD_SHA}">${HEAD_SHA::7}</a>. Debug-signed, for testing only, not for production.</p>
          </body></html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy the download page
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
