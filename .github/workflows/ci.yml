name: CI

on:
  push:
    branches: [main, "ci/*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Uses the Gradle wrapper from the repository and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      # Instrumentation and BlackBox tests need a device and do not run here,
      # but they must still compile.
      - name: Compile instrumentation and BlackBox tests
        run: ./gradlew assembleDebugAndroidTest assembleBlackbox

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
