name: CI

on:
  push:
    branches: [main, "ci/*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels the older run on every branch except main: a run on main may be publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Uses the Gradle wrapper from the repository and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      # Instrumentation and BlackBox tests need a device and do not run here,
      # but they must still compile.
      - name: Compile instrumentation and BlackBox tests
        run: ./gradlew assembleDebugAndroidTest assembleBlackbox

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Publishes the debug APK of every green push to main as a GitHub pre-release.
  # The APK has to be signed with the same debug key as the builds on the phone, otherwise Android
  # refuses to install it over the existing app (and uninstalling would erase the app data). A
  # runner generates a fresh debug key on every run, so the key comes from the repository secret
  # DEBUG_KEYSTORE_BASE64 (base64 of ~/.android/debug.keystore).
  publish-test-apk:
    name: Publish test APK
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::The secret DEBUG_KEYSTORE_BASE64 is not set. Without it the APK would get a random key and could not update the installed app."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build the test APK
        run: ./gradlew assembleDebug "-PappVersionSuffix=-test.${{ github.run_number }}+${GITHUB_SHA::7}"

      - name: Show the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256'

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="test-${{ github.run_number }}"
          apk="frigate-android-${tag}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --prerelease --target "$GITHUB_SHA" \
              --title "Test build ${{ github.run_number }}" \
              --notes "Test build of main at ${GITHUB_SHA}. Debug-signed, not for production."
          fi
